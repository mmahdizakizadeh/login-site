<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="hero">
      <div class="form-box">
        <div class="button-box">
          <div id="btn"></div>
          <button class="toggle-btn" onclick="login()">ورود</button>
          <button class="toggle-btn" onclick="register()">ثبت نام</button>
        </div>

        <div class="social">
          <ul>
            <li>
              <a href="#"><i class="fab fa-google-plus"></i></a>
            </li>
            <li>
              <a href="#"><i class="fab fa-facebook-f"></i></a>
            </li>
            <li>
              <a href="#"><i class="fab fa-twitter"></i></a>
            </li>
          </ul>
        </div>

        <form id="login" class="input-group">
          <input
            type="text"
            class="input-field"
            placeholder="نام کاربری یا ایمیل"
          />
          <input type="password" class="input-field" placeholder="رمز عبور" />
          <input type="checkbox" id="chekbox" />
          <label for="chekbox"> مرا بخاطر بسپار </label>
          <input type="submit" value="ورود" />
        </form>

        <form id="register" class="input-group">
          <input type="text" class="input-field" placeholder="نام کاربری  " />
          <input
            type="text"
            class="input-field"
            placeholder="نام کاربری یا ایمیل"
          />
          <input type="password" class="input-field" placeholder="رمز عبور" />
          <input type="checkbox" id="chakbox" />
          <label for="chakbox"> مرا بخاطر بسپار </label>
          <input type="submit" value="ورود" />
        </form>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
